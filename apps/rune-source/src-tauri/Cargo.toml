[package]
name = "rune-source"
version = "0.3.4-alpha.1"
description = "Visual source control client for Rune VCS"
authors = ["Johan Ottosson"]
license = "MIT"
repository = "https://github.com/Johan-Ott/rune-vcs"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8.4", features = [] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }

# Rune VCS crates
rune-core = { path = "../../../crates/rune-core" }
rune-store = { path = "../../../crates/rune-store" }
tauri-core = { path = "../../../shared/tauri-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
