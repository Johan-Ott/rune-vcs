[package]
name = "nordic-file-explorer"
version = "1.0.0"
description = "A modern VCS-enabled file explorer with Nordic glassmorphism design"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/nordic-file-explorer"
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.0", features = ["isolation"] }

[dependencies]
tauri = { version = "1.0", features = ["api-all", "isolation"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
dirs = "5.0"
walkdir = "2.3"
ignore = "0.4"
git2 = { version = "0.18", optional = true }

# Optional VCS integrations
[dependencies.git2]
version = "0.18"
optional = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
git-support = ["git2"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-fs-extra = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-notification = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }