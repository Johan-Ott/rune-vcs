[package]
name = "tauri-core"
version = "0.1.0"
edition = "2021"
description = "Shared Tauri commands and utilities for Rune VCS apps"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.4", features = [] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }

# Rune VCS core dependencies
rune-core = { path = "../../crates/rune-core" }
rune-store = { path = "../../crates/rune-store" }
