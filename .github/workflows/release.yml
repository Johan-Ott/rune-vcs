name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - beta
          - stable
      platforms:
        description: "Platforms to build for"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux-only
          - macos-only
          - windows-only
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*" # Support alpha/beta tags

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Don't cancel other jobs if one fails
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross for ARM64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Setup Windows Build Environment
        if: runner.os == 'Windows'
        run: |
          # Ensure Visual Studio components are available
          echo "Setting up Windows build environment..."
          # Set Windows-specific environment variables
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=link.exe" >> $env:GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross for ARM64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binary (ARM64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} --bin rune

      - name: Build Release Binary (Other Platforms)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} --bin rune

      - name: List Build Output (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Contents of target/${{ matrix.target }}/release/:"
          dir target/${{ matrix.target }}/release/ || echo "Release directory not found"

      - name: List Build Output (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "Contents of target/${{ matrix.target }}/release/:"
          ls -la target/${{ matrix.target }}/release/ || echo "Release directory not found"

      - name: Verify Build (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "Build completed. Checking for binary..."
          if [[ -f "target/${{ matrix.target }}/release/rune" ]]; then
            echo "✓ Binary found: target/${{ matrix.target }}/release/rune"
            ls -la target/${{ matrix.target }}/release/rune
          else
            echo "❌ Binary not found!"
            echo "Directory contents:"
            ls -la target/${{ matrix.target }}/release/ || echo "Release directory not found"
            exit 1
          fi

      - name: Verify Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "Build completed. Checking for Windows binary..."
          if (Test-Path "target/${{ matrix.target }}/release/rune.exe") {
            echo "✓ Windows binary found: target/${{ matrix.target }}/release/rune.exe"
            Get-ChildItem target/${{ matrix.target }}/release/rune.exe
          } else {
            echo "❌ Windows binary not found!"
            echo "Directory contents:"
            Get-ChildItem target/${{ matrix.target }}/release/ -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Package Release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          NAME="rune-${VERSION}-${{ matrix.target }}"

          # Create the package
          mkdir -p dist

          # Debug: List the target directory
          echo "Contents of target/${{ matrix.target }}/release/:"
          ls -la target/${{ matrix.target }}/release/ || echo "Directory not found"

          if [[ -f "target/${{ matrix.target }}/release/rune" ]]; then
            echo "✓ Binary found, creating tar.gz"
            tar -czf dist/${NAME}.tar.gz -C target/${{ matrix.target }}/release rune
            # Generate checksum for this file
            cd dist
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              shasum -a 256 ${NAME}.tar.gz > ${NAME}.tar.gz.sha256
            else
              sha256sum ${NAME}.tar.gz > ${NAME}.tar.gz.sha256
            fi
            cd ..
          else
            echo "❌ Binary not found at target/${{ matrix.target }}/release/rune"
            echo "Available files:"
            find target -name "rune*" -type f 2>/dev/null || echo "No rune binary found"
            exit 1
          fi

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $NAME = "rune-${VERSION}-${{ matrix.target }}"

          # Create the package directory
          New-Item -ItemType Directory -Force -Path dist

          # Debug: List the target directory  
          echo "Contents of target/${{ matrix.target }}/release/:"
          Get-ChildItem target/${{ matrix.target }}/release/ -ErrorAction SilentlyContinue

          if (Test-Path "target/${{ matrix.target }}/release/rune.exe") {
            echo "✓ Creating zip package"
            Compress-Archive -Path "target/${{ matrix.target }}/release/rune.exe" -DestinationPath "dist/${NAME}.zip"
            Set-Location dist
            Get-FileHash "${NAME}.zip" -Algorithm SHA256 | Select-Object Hash | Out-File "${NAME}.zip.sha256" -Encoding ASCII
            Set-Location ..
          } else {
            echo "❌ Windows binary not found at target/${{ matrix.target }}/release/rune.exe"
            echo "Available files:"
            Get-ChildItem target -Recurse -Name "rune*" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rune-*.${{ matrix.archive }}
            dist/rune-*.${{ matrix.archive }}.sha256
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
